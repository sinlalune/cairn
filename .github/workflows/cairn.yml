# Cairn protocol gate. Installed ADAPTER, not portable protocol.
name: cairn
on:
  pull_request:
  push:
    # The trunk alone. Two runs on one commit can disagree and only the
    # request's is the merge gate, so a unit on a path branch is judged by the
    # writer's bare gate and by the request's run once one is open — as a draft
    # from the first unit, for a writer who wants the forge on every one
    # (ADR-005).
    branches: [main]
jobs:
  protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The red-run reading asks the forge how many runs of this branch went
      # red, which is `actions: read`. An explicit block sets every scope it
      # does not name to `none`, so leaving this out would refuse exactly the
      # reading the post-mortem step exists to write.
      actions: read
      # The request reading and the one comment. Nothing here writes to the
      # REPOSITORY: a branch has one writer, and it is the writer of the path,
      # never this job. On a request from a fork the token is read-only
      # whatever this block says, so `gh pr comment` ends the step with a 403
      # instead of posting; this repository has one owner and no fork requests,
      # and the case is named here rather than handled.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate must judge the branch that will land, so it needs history
          # rather than a shallow single commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bare. A pipe would report the LAST command's exit code, which is how a
      # gate comes to pass over its own failure. The suite runs first, because a
      # checker whose suite is red has no verdict to give, and both steps are
      # one job, so `cairn-check` stays the one required check. Under this
      # repository's own name: the kit installs no suite and its workflow runs
      # no such step (ADR-014 decision 2).
      - name: cairn-test
        run: npm run cairn-test
      - name: cairn-check
        id: cairn-check
        env:
          # The base must span the ARRIVAL. On a request that is the target
          # branch; on a push to the trunk it is the commit the push replaced,
          # because `origin/main` after the push already names the pushed
          # commit and comparing it with itself is how every integrating unit
          # this repository has landed reached ZERO changed files — no
          # `transition`, no `acceptance`, no `journal-entry`, no
          # `scope-digest`, over a green run. `github.event.before` is forty
          # zeros on a repository's first push to the trunk, which the checker
          # reports as an advisory — nothing precedes that commit — rather than
          # dying on it. A push to a PATH branch keeps the trunk as its base:
          # comparing a branch push with the push before it is the `--previous`
          # form `comparisonRef` condemns, and is how twenty-six edited records
          # went unjudged.
          CAIRN_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || (github.ref_name == 'main' && github.event.before || 'origin/main') }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is back, because the READING changed. This token still
          # cannot see a ruleset's bypass list — GitHub returns `bypass_actors`
          # only to a caller with write access to the ruleset and ELIDES it
          # otherwise, and `administration` is not among the permissions a
          # workflow's own token can be granted — but the checker no longer
          # reads that silence as a trunk nobody bypasses. The profile line
          # names the bypass list as NOT READ and reports the gaps this token
          # can see beside it, so the run says exactly what it saw (ADR-026
          # decision 1). It was out from 2026-09-13, when run 34756757308
          # printed "forge enforces everything these records name" over an
          # always-bypass role, until that reading was fixed.
        run: node tools/cairn-check.mjs --base "$CAIRN_BASE_REF"
      # Only on the CHECKER's failure, so the incident is written while it
      # happens (ADR-014 decision 1). A red suite is a different incident, and
      # a post-mortem of a repository the checker never judged would be a
      # reading nobody asked for. It prints, and commits nothing.
      - name: cairn-postmortem
        if: failure() && steps.cairn-check.conclusion == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAIRN_BRANCH: ${{ github.head_ref || github.ref_name }}
          CAIRN_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          # The shell is `bash -e`, so a non-zero exit would abort the step
          # before the reading is printed or posted, losing it on the one run
          # it was written for. stderr is captured with it: where the tool
          # stops, the reason it gives is written there.
          node tools/cairn-postmortem.mjs --branch "$CAIRN_BRANCH" > postmortem.txt 2>&1 || true
          cat postmortem.txt
          if [ -n "$CAIRN_REQUEST" ]; then
            gh pr comment "$CAIRN_REQUEST" --body-file postmortem.txt
          fi
